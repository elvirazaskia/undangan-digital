<!-- File musik Anda dimasukkan ke sini menggunakan ID bawaan template -->
<audio id="audio" loop>

</audio>

<!-- Script wajib untuk memicu musik agar aktif saat layar diklik pertama kali -->
<script>
document.addEventListener('click', function() {
    var audio = document.getElementById("audio");
    if (audio.paused) {
        audio.play().catch(function(error) {
            console.log("Pemutaran musik tertahan oleh browser:", error);
        });
    }
}, { once: true });
</script>
